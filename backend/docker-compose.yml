version: "3.9"

services:
  db:
    image: postgres:16
    container_name: bathycat-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bathycat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bathycat-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
